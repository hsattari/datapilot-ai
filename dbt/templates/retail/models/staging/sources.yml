version: 2
sources:
  - name: raw_sales
    description: Bronze tables loaded by the DataPilot ingestion worker
    tables:
      - name: orders
        columns:
          - name: order_id
          - name: order_date
          - name: net_sales
      - name: products
        description: Optional product list (product, category). Duplicate or blank keys are quarantined.
      - name: customers
        description: Optional customer list (customer_id, segment). Duplicate or blank keys are quarantined.
