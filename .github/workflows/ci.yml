name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/api/requirements.txt
      - name: Tests (unit, security, data quality, AI gold questions)
        run: cd apps/api && python -m pytest -q
      - name: Migrations apply cleanly
        run: cd apps/api && DATABASE_URL=sqlite:///./ci.db alembic upgrade head
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install dbt-duckdb duckdb
      - name: dbt template builds, reconciles and tests can fail
        run: python dbt/check_template.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: datapilot, POSTGRES_PASSWORD: datapilot, POSTGRES_DB: datapilot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datapilot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/api/requirements.txt
      - name: Full suite on PostgreSQL + pgvector (schema built from migrations)
        run: cd apps/api && TEST_DATABASE_URL=postgresql+psycopg2://datapilot:datapilot@localhost:5432/datapilot python -m pytest -q
  images:
    # Build both images and fail on fixable CRITICAL/HIGH vulnerabilities (OS packages and Python/Node libraries).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t datapilot-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile --build-arg API_URL=http://datapilot-api -t datapilot-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "datapilot-api:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", vuln-type: "os,library" }
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "datapilot-web:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", vuln-type: "os,library" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd apps/web && npm ci && npm run typecheck && npm run build
